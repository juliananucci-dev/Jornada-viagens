<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada Viagens</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
      <a class="a-logo" href="index.html" title="voltar para a página inicial">
        <img class="logo-mobile" src="img/Logo-provisória-branca 1.png" alt="Bussola do logo Jornada Viagens na cor branca">
        <img class="logo-desktop" src="img/Logo-provisória-branca 1.svg" alt="Bussola do logo Jornada Viagens na cor branca">
      </a>
      <div class="list-menu">
        <label for="menu">
          <img class="menu" src="img/menu.svg" alt="menu">
        </label>
        <input type="checkbox" id="menu" hidden>
          <nav>
            <ul>
              <li><a href="blog.html" title="acessar blog" target="_blank">Blog</a></li>
              <li><a href="pacotes.html" title="acessar pacotes de viagens" target="_blank">Pacotes de viagens</a></li>
              <li><a href="contato.html" title="acessar contato" target="_blank">Contato</a></li>
            </ul>
          </nav>
          <!--a tag <nav> é usada para criar uma área de navegação do site, ou seja, uma região que reúne links para ajudar o usuário a se movimentar entre páginas ou seções.-->
      </div>
      <!-- a tag div é um container genérico usado para agrupar elementos HTML. -->
    </header>
    <section class="hero">
      <div class="hero-img"></div>

      <!--Precisamos colocar a imagem como uma div e nao como uma tag <img> para podermos usar os atributos background image, no repeat e cover lá no css-->
    
      <h2>Somos uma agência apaixonada por criar viagens inesquecíveis. Do destino à seleção das atividades, cuidamos de todos os detalhes para que você aproveite ao máximo cada momento da sua jornada!</h2>
    </section>
</body>
</html>
